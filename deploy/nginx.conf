# nginx reverse proxy for postlite (TLS via certbot or your own certs).
server {
    listen 443 ssl http2;
    server_name social.example.com;

    ssl_certificate     /etc/letsencrypt/live/social.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.example.com/privkey.pem;

    client_max_body_size 2g;          # video uploads
    proxy_request_buffering off;      # stream uploads straight to postlite
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # MCP responses + media range requests
    }
}

server {
    listen 80;
    server_name social.example.com;
    return 301 https://$host$request_uri;
}
