# Add to your Hermes config.yaml; put POSTLITE_API_KEY in the profile's .env
mcp_servers:
  postlite:
    url: "https://social.example.com/mcp"
    headers:
      Authorization: "Bearer ${POSTLITE_API_KEY}"

